name: Multi Job Workflow

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build step
        run: echo "Building..."

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Test step
        run: echo "Testing..."

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Deploy step
        run: echo "Deploying..."

# golangci-lint configuration v2
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - misspell
    - gocritic
    - unconvert
    - govet
    - gocyclo

formatters:
  enable:
    - gofmt
    - goimports

settings:
  gocyclo:
    min-complexity: 15

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - hugeParam
      - rangeValCopy

  misspell:
    locale: US

  errcheck:
    check-type-assertions: true
    check-blank: true

exclusions:
  paths:
    - testdata
  rules:
    - path: _test\.go$
      linters:
        - errcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
